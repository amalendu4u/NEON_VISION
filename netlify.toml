[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/player"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/docs"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/docs/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/workbench"
  to = "/workbench.html"
  status = 200
